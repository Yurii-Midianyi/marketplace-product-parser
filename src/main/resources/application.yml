spring:
  application:
    name: marketplace-product-parser
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource: # update when postgres is in place
    generate-unique-name: false
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    # 9092 is by the embedded H2 server, so use 19092.
    bootstrap-servers: localhost:19092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      missing-topics-fatal: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

      properties:
        # Keeps an import from stalling for the 60s default when no broker is up.
        max.block.ms: 3000
app:
  kafka:
    incoming-topic: product.exports.incoming
    consumer-group-id: marketplace-product-parser

    incoming-dlt-topic: product.exports.incoming.dlt
    incoming-auto-startup: true
    incoming-concurrency: 1

    incoming-retry-backoff-ms: 1000
    incoming-max-retries: 2
    product-upserted-topic: product.upserted

file-processing:
  input-dir: "data/input-folder"
  processed-dir: "data/processed-folder"
  failed-dir: "data/failed-folder"
  cron: "*/50 * * * * *"
  thread-pool-size: 10
  max-export-age-days: 30
  file-processing-timeout-minutes: 5
