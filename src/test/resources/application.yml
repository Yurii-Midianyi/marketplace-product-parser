spring:
  profiles:
    active: test
  application:
    name: marketplace-product-parser-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      auto-startup: false
      missing-topics-fatal: false

app:
  kafka:
    incoming-topic: product.exports.incoming
    consumer-group-id: marketplace-product-parser-test
    incoming-dlt-topic: product.exports.incoming.dlt
    incoming-auto-startup: false
    incoming-concurrency: 1
    incoming-retry-backoff-ms: 0
    incoming-max-retries: 0
    product-upserted-topic: product.upserted

file-processing:
  input-dir: "target/test-data/input"
  processed-dir: "target/test-data/processed"
  failed-dir: "target/test-data/failed"
  cron: "0 0 0 31 12 ?"
  thread-pool-size: 2
  max-export-age-days: 30
  file-processing-timeout-minutes: 5
